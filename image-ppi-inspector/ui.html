    .scrubbable_control--containerBordered---60m8:focus-within { background-color: var(--ui3-bg) !important; border-color: var(--ui3-border-selected) !important; outline: none; }
    .transform_panel--inactiveLabel--ffsiD { font-size: 11px; font-weight: 400; color: var(--ui3-text-tertiary); padding-right: 2px; }
    .raw_components--textInput--DZIFa { width: 100%; border: none; background: transparent; outline: none; font-size: 11px; font-weight: 500; color: var(--ui3-text); text-align: center; letter-spacing: -0.01em; }

    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none !important; margin: 0 !important; }
    input[type=number] { -moz-appearance: textfield !important; appearance: none !important; }

    button#resizeBtn { background-color: var(--ui3-bg-brand); color: var(--ui3-text-on-brand); border: none; border-radius: 6px; height: 32px; width: 100%; margin-top: 4px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    button#resizeBtn:hover { background-color: var(--ui3-bg-brand-hover); }

    .btn-download-cc { background-color: transparent; border: 1px solid var(--ui3-border-selected); color: var(--ui3-text-brand); border-radius: 6px; height: 32px; padding: 0 16px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.1s ease; display: flex; align-items: center; justify-content: center; width: 100%; flex-shrink: 0; }
    .btn-download-cc:hover { background-color: var(--ui3-bg-selected); }

    /* Checkbox from PDF Smart Import */
    .checkbox-row {
      display: flex; align-items: center; justify-content: center; margin-bottom: 8px;
    }
    .checkbox-row > label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11px; color: var(--ui3-text); user-select: none; }
    .checkbox-row input[type="checkbox"] {
      position: relative;
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--ui3-border);
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      transition: background-color .1s ease, border-color .1s ease;
    }
    .checkbox-row label:hover input[type="checkbox"]:not(:disabled) {
      border-color: var(--ui3-border-strong);
      background: var(--ui3-bg-hover);
    }
    .checkbox-row input[type="checkbox"]:checked::after {
      position: absolute;
      inset: 2px;
      background: var(--ui3-icon);
      content: "";
      mask: url("data:image/svg+xml;charset=utf-8,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2 6L5 9L10 3' stroke='black' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' /%3E%3C/svg%3E") center / 12px 12px no-repeat;
      -webkit-mask: url("data:image/svg+xml;charset=utf-8,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2 6L5 9L10 3' stroke='black' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' /%3E%3C/svg%3E") center / 12px 12px no-repeat;
    }
    .checkbox-row input[type="checkbox"]:disabled { cursor: not-allowed; }
    .checkbox-row label:has(input[type="checkbox"]:disabled) { opacity: .5; cursor: not-allowed; }
    .checkbox-row input[type="checkbox"]:focus-visible { outline: 2px solid var(--ui3-border-selected); outline-offset: 1px; }

    @media (prefers-color-scheme: dark) {
      .checkbox-row input[type="checkbox"] {
        background-color: #3A3A3A;
        border-color: #616161;
      }
      .checkbox-row label:hover input[type="checkbox"]:not(:disabled) {
        background-color: #454545;
        border-color: #6A6A6A;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="container"></div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────
    const state = {
      images: [],           // currently displayed image list
      index: 0,             // active image index within images[]
      listContext: '',      // 'Scan' | 'Selection' | ''
      listTotal: 0,         // total images in the scanned scope
      isReviewMode: false,  // true when browsing from list → detail
      targetPpi: 300,       // user-defined target PPI for resize/print calc
      tab: 'ppi',           // active scan tab: 'ppi' | 'cc'
      unit: 'px',           // display unit: 'px' | 'mm'
      scanImages: null,     // saved scan PPI results
      scanCCImages: null,   // saved scan CC results
      scanTotal: 0,         // total images found during scan
      selectionIds: [],     // initial selection, for restore-after-review
      hasSelection: false,  // whether the user has nodes selected in Figma
      scanCC: false,        // whether "Color Correction Check" is enabled
      debugLogs: "No logs yet.",
    };

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeJsQuote(str) {
      if (!str) return "";
      return String(str).replace(/'/g, "\\'").replace(/"/g, "\\\"");
    }

    function fmt(val) {
      if (val === undefined || val === null) return "0";
      return parseFloat(Number(val).toFixed(2)).toString().replace('.', ',');
    }

    function updateSize(immediate = false) {
      const resize = () => {
        const container = document.getElementById('app');
        let height = container.scrollHeight;
        if (height > 550) height = 550; 
        parent.postMessage({ pluginMessage: { type: 'resize-window', width: 300, height: height } }, '*');
      };
      if (immediate) {
        resize();
      } else {
        requestAnimationFrame(resize);
      }
    }

    function copyValue(value, toastMsg) {
      const textarea = document.createElement('textarea');
      textarea.value = value;
      textarea.style.position = 'fixed'; textarea.style.opacity = '0';
      document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea);
      parent.postMessage({ pluginMessage: { type: 'notify', msg: toastMsg } }, '*');
    }

    window.handleCopy = function(e, value, label) {
      e.stopPropagation(); copyValue(value, `Copied: ${value}`);
    };
    
    window.toggleUnit = function() {
      state.unit = state.unit === 'px' ? 'mm' : 'px';
      if (state.images.length > 0) renderImage();
    };

    window.clearScan = function() {
      state.scanImages = null;
      state.scanCCImages = null;
      state.scanTotal = 0;
      state.images = [];
      state.index = 0;
      state.listContext = '';
      state.isReviewMode = false;
      state.selectionIds = [];
      renderEmpty();
    };

    window.updateScanButton = function() {
      state.scanCC = document.getElementById('scan-cc').checked;
      const btn = document.getElementById('scan-btn');
      const scope = state.hasSelection ? 'Selected' : 'Page';
      btn.textContent = state.scanCC ? `Scan ${scope} (PPI & CC)` : `Scan ${scope} for Low PPI`;
    };

    function renderEmpty() {
      const app = document.getElementById('app');
      const scope = state.hasSelection ? 'Selected' : 'Page';
      const btnText = state.scanCC ? `Scan ${scope} (PPI & CC)` : `Scan ${scope} for Low PPI`;
      app.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-content"><div>Select an image to inspect...</div></div>
          <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
            <div class="checkbox-row">
              <label>
                <input type="checkbox" id="scan-cc" onchange="updateScanButton()" ${state.scanCC ? 'checked' : ''}>
                Color Correction Check
              </label>
            </div>
            <button class="btn-secondary" id="scan-btn" onclick="startScan()">${btnText}</button>
          </div>
        </div>
      `;
      updateSize();
    }

    window.startScan = function() {
      state.scanCC = document.getElementById('scan-cc').checked;
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-content">
            <div style="color: var(--ui3-text-brand); font-weight: 500;" id="scan-status">Preparing scan...</div>
            <div class="progress-container"><div class="progress-bar" id="pb"></div></div>
            <div style="font-size: 10px; margin-top: 4px;" id="scan-count">0 / 0</div>
          </div>
          <button class="btn-secondary" style="margin-top: 3px;" onclick="cancelScan()">Cancel Scan</button>
        </div>
      `;
      updateSize();
      parent.postMessage({ pluginMessage: { type: 'scan', scope: state.hasSelection ? 'selection' : 'page', includeCC: state.scanCC } }, '*');
    };

    window.cancelScan = function() {
      const el = document.getElementById('scan-status');
      if (el) el.textContent = 'Cancelling...';
      parent.postMessage({ pluginMessage: { type: 'cancel-scan' } }, '*');
    };

    window.switchTab = function(tab) {
      state.tab = tab;
      state.images = tab === 'ppi' ? state.scanImages : state.scanCCImages;
      renderList();
    };

    function renderList() {
      const app = document.getElementById('app');
      const { images, listContext, listTotal, scanImages, scanCCImages, scanTotal, tab } = state;

      // All-clear check
      let isAllClear = false;
      if (listContext === 'Scan' && scanImages !== null) {
        if (scanImages.length === 0 && (!scanCCImages || scanCCImages.length === 0)) isAllClear = true;
      } else if (images.length === 0) {
        isAllClear = true;
      }

      if (isAllClear) {
        app.innerHTML = `<div class="empty-state"><div class="empty-state-content"><div class="success" style="font-size: 14px; font-weight: 600;">✅ All clear!</div><div style="margin-top: 4px;">Scanned ${listTotal} images.<br>No issues found.</div></div><button class="btn-secondary" onclick="clearScan()">Back</button></div>`;
        updateSize(); return;
      }

      // Tabs (only shown in Scan mode with CC results)
      let tabsHtml = '';
      if (listContext === 'Scan' && scanCCImages !== null) {
        tabsHtml = `
          <div class="tabs">
            <div class="tab ${tab === 'ppi' ? 'active' : ''}" onclick="switchTab('ppi')">Low PPI (${scanImages.length})</div>
            <div class="tab ${tab === 'cc' ? 'active' : ''}" onclick="switchTab('cc')">Color Correction (${scanCCImages.length})</div>
          </div>`;
      }

      // List rows
      let listContent = '';
      if (images.length === 0) {
        listContent = `<div style="padding: 24px; text-align: center; color: var(--ui3-text-secondary); font-size: 11px;">No images in this category.</div>`;
      } else {
        listContent = images.map(img => {
          let rightSide = '';
          if (tab === 'cc') {
            rightSide = `<div class="scan-item-ppi"><span style="background: var(--ui3-bg-selected); color: var(--ui3-text-brand); padding: 2px 6px; border-radius: 4px; font-weight: 600;">CC</span></div>`;
          } else {
            const ppiClass = img.ppi < 250 ? 'warning' : (img.ppi < 300 ? 'caution' : 'success');
            rightSide = `<div class="scan-item-ppi ${ppiClass}">${fmt(img.ppi)} PPI</div>`;
          }
          const safeName = escapeHtml(img.name);
          return `<div class="scan-item" onclick="enterReviewMode('${img.id}')"><div class="scan-item-name" title="${safeName}">${safeName}</div>${rightSide}</div>`;
        }).join('');
      }

      const title = listContext === 'Scan' ? `${images.length} issues found` : `${images.length} images selected`;
      const subtitle = listContext === 'Scan' ? `<span class="counter">(out of ${listTotal})</span>` : '';
      const leftAction = listContext === 'Scan' ? `<button class="nav-btn" onclick="clearScan()" style="font-size: 11px; padding-left: 0;">Clear</button>` : '';

      app.innerHTML = `
        <div class="toolbar" style="display: grid; grid-template-columns: 1fr auto 1fr;">
          <div style="display: flex; align-items: center;">${leftAction}</div>
          <div style="display: flex; align-items: center; justify-content: center; gap: 4px;"><span class="counter" style="font-weight: 500; color: var(--ui3-text);">${title}</span>${subtitle}</div>
          <div></div>
        </div>
        ${tabsHtml}
        <div class="scan-list">${listContent}</div>
      `;
      updateSize();
    }

    window.enterReviewMode = function(id) {
      state.isReviewMode = true;
      state.index = state.images.findIndex(img => img.id === id);
      parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: id } }, '*');
      renderImage();
    };

    window.viewList = function() {
      state.isReviewMode = false;
      if (state.listContext === 'Selection' && state.selectionIds.length > 0) {
        parent.postMessage({ pluginMessage: { type: 'restore-selection', nodeIds: state.selectionIds } }, '*');
      }
      renderList();
    };

    window.handlePpiInput = function(val) {
      const ppi = parseFloat(val);
      if (isNaN(ppi) || ppi <= 0) return;
      state.targetPpi = ppi;
      const img = state.images[state.index];
      if (!img) return;
      const maxW = img.printW * (img.ppi / state.targetPpi);
      const maxH = img.printH * (img.ppi / state.targetPpi);
      const el = document.getElementById('maxPrintVal');
      if (el) {
        el.innerHTML = `<span class="copy-part" title="Copy Max Width" onclick="copyValue('${fmt(maxW)}', 'Copied: ${fmt(maxW)}')">${fmt(maxW)}</span><span class="copy-sep" title="Copy full Max Print" onclick="copyValue('${fmt(maxW)} × ${fmt(maxH)} mm', 'Copied: ${fmt(maxW)} × ${fmt(maxH)} mm')">×</span><span class="copy-part" title="Copy Max Height" onclick="copyValue('${fmt(maxH)}', 'Copied: ${fmt(maxH)}')">${fmt(maxH)}</span> <span style="color: var(--ui3-text-secondary);">mm</span>`;
      }
    };

    function renderImage() {
      try {
      const app = document.getElementById('app');
      if (state.images.length === 0) { renderEmpty(); return; }
      const img = state.images[state.index];
      const { unit, isReviewMode, targetPpi, images, index } = state;

      const safeNameHtml = escapeHtml(img.name);
      const safeNameJs   = escapeJsQuote(img.name);

      const isMm = unit === 'mm';
      const pX = isMm ? (img.posX / 72) * 25.4 : img.posX;
      const pY = isMm ? (img.posY / 72) * 25.4 : img.posY;
      const posStr = `X: ${fmt(pX)} ${unit}, Y: ${fmt(pY)} ${unit}`;
      const oW = isMm ? (img.origW / img.ppi) * 25.4 : img.origW;
      const oH = isMm ? (img.origH / img.ppi) * 25.4 : img.origH;
      const cW = isMm ? (img.curW / 72) * 25.4 : img.curW;
      const cH = isMm ? (img.curH / 72) * 25.4 : img.curH;

      const ppiStr   = `${fmt(img.ppi)}`;
      const maxW     = img.printW * (img.ppi / targetPpi);
      const maxH     = img.printH * (img.ppi / targetPpi);
      const ppiClass = img.ppi < 250 ? 'warning' : (img.ppi < 300 ? 'caution' : 'success');
      const hasCC    = Boolean(img.hasCC);

      const ccIndicatorHtml = hasCC
        ? `<span class="value" style="color: var(--ui3-text-brand); font-weight: 600;">Applied</span>`
        : `<span class="value" style="color: var(--ui3-text-secondary); font-weight: 500;">None</span>`;

      const navSvgPrev = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="transform: scaleX(-1);"><path fill-rule="evenodd" clip-rule="evenodd" d="M6.76754 5.52511C6.9628 5.32985 7.27938 5.32985 7.47465 5.52511L9.59596 7.64643L9.94952 7.99999L9.59596 8.35354L7.47465 10.4749C7.27938 10.6701 6.9628 10.6701 6.76754 10.4749C6.57228 10.2796 6.57228 9.96302 6.76754 9.76775L8.53531 7.99999L6.76754 6.23222C6.57228 6.03695 6.57228 5.72037 6.76754 5.52511Z" fill="currentColor" fill-opacity="0.9"/></svg>`;
      const navSvgNext = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M6.76754 5.52511C6.9628 5.32985 7.27938 5.32985 7.47465 5.52511L9.59596 7.64643L9.94952 7.99999L9.59596 8.35354L7.47465 10.4749C7.27938 10.6701 6.9628 10.6701 6.76754 10.4749C6.57228 10.2796 6.57228 9.96302 6.76754 9.76775L8.53531 7.99999L6.76754 6.23222C6.57228 6.03695 6.57228 5.72037 6.76754 5.52511Z" fill="currentColor" fill-opacity="0.9"/></svg>`;

      const navHtml = images.length > 1 ? `
        <button class="nav-btn" id="prevBtn" ${index === 0 ? 'disabled' : ''}>${navSvgPrev}</button>
        <span class="counter">Image ${index + 1} of ${images.length}</span>
        <button class="nav-btn" id="nextBtn" ${index === images.length - 1 ? 'disabled' : ''}>${navSvgNext}</button>` : '';

      const toolbarHtml = `
        <div class="toolbar" style="display: grid; grid-template-columns: 1fr auto 1fr;">
          <div style="display: flex; align-items: center;">
            ${isReviewMode ? `<button class="nav-btn" onclick="viewList()" style="font-size: 11px; padding-left: 0;">Image List</button>` : ''}
          </div>
          <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">${navHtml}</div>
          <div style="display: flex; align-items: center; justify-content: flex-end;">
            <button class="nav-btn" onclick="toggleUnit()" style="font-size: 11px; padding-right: 0;" title="Toggle between Pixels and Millimeters">Unit: ${unit.toLowerCase()}</button>
          </div>
        </div>`;

      app.innerHTML = `
        ${toolbarHtml}
        <div class="data-content">
          <div class="section-1">
            <div class="layer-row"><span class="label">Layer Name</span><div class="layer-name-container"><span class="layer-name-value copyable" title="Click to copy" onclick="handleCopy(event, '${safeNameJs}', 'Layer Name')">${safeNameHtml}</span><div class="tooltip">${safeNameHtml}</div></div></div>

            <div class="row"><span class="label">Effective PPI</span><span class="value copyable ppi-value ${ppiClass}" title="Click to copy" onclick="handleCopy(event, '${ppiStr}', 'PPI')">${ppiStr}</span></div>

            <div class="row"><span class="label">Current Size</span>
              <span class="value">
                <span class="copy-part" title="Copy Current Width" onclick="copyValue('${fmt(cW)}', 'Copied: ${fmt(cW)}')">${fmt(cW)}</span>
                <span class="copy-sep" title="Copy full Current Size" onclick="copyValue('${fmt(cW)} × ${fmt(cH)} ${unit}', 'Copied: ${fmt(cW)} × ${fmt(cH)} ${unit}')">×</span>
                <span class="copy-part" title="Copy Current Height" onclick="copyValue('${fmt(cH)}', 'Copied: ${fmt(cH)}')">${fmt(cH)}</span>
                <span style="color: var(--ui3-text-secondary);">${unit}</span>
              </span>
            </div>

            <div class="row"><span class="label">Color Correction</span>${ccIndicatorHtml}</div>

            <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">
              ${hasCC ? `<button class="btn-download-cc" id="downloadCcBtn">Download Image with Corrections</button>` : ''}
              <button class="btn-secondary" id="downloadBtn">Download Original Image</button>
            </div>
          </div>

          <div class="section-2">
            <div class="row"><span class="label">Original Size</span>
              <span class="value">
                <span class="copy-part" title="Copy Original Width" onclick="copyValue('${fmt(oW)}', 'Copied: ${fmt(oW)}')">${fmt(oW)}</span>
                <span class="copy-sep" title="Copy full Original Size" onclick="copyValue('${fmt(oW)} × ${fmt(oH)} ${unit}', 'Copied: ${fmt(oW)} × ${fmt(oH)} ${unit}')">×</span>
                <span class="copy-part" title="Copy Original Height" onclick="copyValue('${fmt(oH)}', 'Copied: ${fmt(oH)}')">${fmt(oH)}</span>
                <span style="color: var(--ui3-text-secondary);">${unit}</span>
              </span>
            </div>

            <div class="row"><span class="label">Crop Positioning</span>
              <span class="value">
                <span style="color: var(--ui3-text-secondary); font-weight: 400;">X:</span>
                <span class="copy-part" title="Copy X" onclick="copyValue('${fmt(pX)}', 'Copied: ${fmt(pX)}')">${fmt(pX)}</span>
                <span class="copy-sep" title="Copy full Crop Positioning" onclick="copyValue('X: ${fmt(pX)} ${unit}, Y: ${fmt(pY)} ${unit}', 'Copied: X: ${fmt(pX)} ${unit}, Y: ${fmt(pY)} ${unit}')">,</span>
                <span style="color: var(--ui3-text-secondary); font-weight: 400;">Y:</span>
                <span class="copy-part" title="Copy Y" onclick="copyValue('${fmt(pY)}', 'Copied: ${fmt(pY)}')">${fmt(pY)}</span>
                <span style="color: var(--ui3-text-secondary); font-weight: 400;">${unit}</span>
              </span>
            </div>

            <div class="row"><span class="label">Scale</span>
              <span class="value">
                <span class="copy-part" title="Copy Scale X" onclick="copyValue('${fmt(img.resScaleX)}', 'Copied: ${fmt(img.resScaleX)}')">${fmt(img.resScaleX)}%</span>
                <span class="copy-sep" title="Copy full Scale" onclick="copyValue('${fmt(img.resScaleX)}% × ${fmt(img.resScaleY)}%', 'Copied: ${fmt(img.resScaleX)}% × ${fmt(img.resScaleY)}%')">×</span>
                <span class="copy-part" title="Copy Scale Y" onclick="copyValue('${fmt(img.resScaleY)}', 'Copied: ${fmt(img.resScaleY)}')">${fmt(img.resScaleY)}%</span>
              </span>
            </div>

            <div class="row" style="justify-content: flex-end; margin-top: 4px;">
              <span class="action-link" id="copyInfoBtn">Copy Full Info</span>
            </div>
          </div>

          <div class="section-3">
            <div class="row"><span class="label">Target PPI</span><div class="variable_control--inputWrapper--LUhHu"><label class="scrubbable_control--containerBordered---60m8"><span class="transform_panel--inactiveLabel--ffsiD">PPI</span><div style="flex:1; display:flex;"><input type="number" id="targetPpi" class="raw_components--textInput--DZIFa" value="${targetPpi}" oninput="handlePpiInput(this.value)" onfocus="this.select()"></div></label></div></div>

            <div class="row"><span class="label">Max Print</span>
              <span class="value" id="maxPrintVal">
                <span class="copy-part" title="Copy Max Width" onclick="copyValue('${fmt(maxW)}', 'Copied: ${fmt(maxW)}')">${fmt(maxW)}</span>
                <span class="copy-sep" title="Copy full Max Print" onclick="copyValue('${fmt(maxW)} × ${fmt(maxH)} mm', 'Copied: ${fmt(maxW)} × ${fmt(maxH)} mm')">×</span>
                <span class="copy-part" title="Copy Max Height" onclick="copyValue('${fmt(maxH)}', 'Copied: ${fmt(maxH)}')">${fmt(maxH)}</span>
                <span style="color: var(--ui3-text-secondary);">mm</span>
              </span>
            </div>
            <button id="resizeBtn">Resize to Target PPI</button>
          </div>
        </div>
      `;

      setTimeout(() => {
        const nameEl = app.querySelector('.layer-name-value');
        const container = app.querySelector('.layer-name-container');
        if (nameEl && container && nameEl.scrollWidth > nameEl.offsetWidth + 1) {
          container.classList.add('is-truncated');
        }
      }, 50);

      if (images.length > 1) {
        document.getElementById('prevBtn').onclick = () => {
          state.index--;
          if (state.isReviewMode) parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: state.images[state.index].id } }, '*');
          renderImage();
        };
        document.getElementById('nextBtn').onclick = () => {
          state.index++;
          if (state.isReviewMode) parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: state.images[state.index].id } }, '*');
          renderImage();
        };
      }

      document.getElementById('downloadBtn').onclick = () =>
        parent.postMessage({ pluginMessage: { type: 'download-image', nodeId: img.id } }, '*');

      if (hasCC) {
        document.getElementById('downloadCcBtn').onclick = () =>
          parent.postMessage({ pluginMessage: { type: 'download-image-cc', nodeId: img.id } }, '*');
      }

      document.getElementById('copyInfoBtn').onclick = () => {
        const info = `Layer Name: ${img.name}\nEffective PPI: ${ppiStr}\nCurrent Size: ${fmt(cW)} × ${fmt(cH)} ${unit}\nOriginal Size: ${fmt(oW)} × ${fmt(oH)} ${unit}\nCrop Positioning: ${posStr}\nScale: ${fmt(img.resScaleX)}% × ${fmt(img.resScaleY)}%`;
        copyValue(info, '📋 Copied Full Layer Info');
      };

      document.getElementById('resizeBtn').onclick = () =>
        parent.postMessage({ pluginMessage: { type: 'resize', targetPpi: parseFloat(document.getElementById('targetPpi').value), nodeId: img.id, origW: img.origW, aspectRatio: img.aspectRatio } }, '*');

      updateSize(true);
      } catch (err) {
        parent.postMessage({ pluginMessage: { type: 'debug-log-ui', log: "UI Error in renderImage: " + err.message + "\\n" + err.stack } }, '*');
      }
    }
    // ── Message Handlers ────────────────────────────────────────────────────

    function onImagesList(msg) {
      // If in review mode and the same image was updated — patch & re-render without flicker
      if (state.isReviewMode && msg.images.length === 1 && state.images.length > 0) {
        const id = msg.images[0].id;
        const idx = state.images.findIndex(img => img.id === id);
        if (idx !== -1) {
          let shouldRender = false;
          if (state.index !== idx) {
            state.index = idx;
            shouldRender = true;
          }
          if (JSON.stringify(state.images[idx]) !== JSON.stringify(msg.images[0])) {
            state.images[idx] = msg.images[0];
            shouldRender = true;
          }
          if (shouldRender) renderImage();
          return;
        }
      }

      // Sync updated images into saved scan results
      if (state.scanImages !== null) {
        msg.images.forEach(incoming => {
          const i = state.scanImages.findIndex(s => s.id === incoming.id);
          if (i !== -1) state.scanImages[i] = incoming;
        });
      }

      // If a single image matches a scan result — enter review mode from scan
      if (msg.images.length === 1 && state.scanImages !== null) {
        const id = msg.images[0].id;
        let idx = state.scanImages.findIndex(img => img.id === id);
        if (idx !== -1) {
          Object.assign(state, { isReviewMode: true, tab: 'ppi', images: state.scanImages, index: idx, listContext: 'Scan', listTotal: state.scanTotal });
          renderImage(); return;
        }
        if (state.scanCCImages !== null) {
          idx = state.scanCCImages.findIndex(img => img.id === id);
          if (idx !== -1) {
            Object.assign(state, { isReviewMode: true, tab: 'cc', images: state.scanCCImages, index: idx, listContext: 'Scan', listTotal: state.scanTotal });
            renderImage(); return;
          }
        }
      }

      // Default: show selection
      state.isReviewMode = false;
      state.images = msg.images;
      state.listTotal = msg.images.length;
      state.listContext = 'Selection';
      if (msg.selectedIds) state.selectionIds = msg.selectedIds;

      if (state.images.length === 0) renderEmpty();
      else if (state.images.length === 1) { state.index = 0; renderImage(); }
      else renderList();
    }

    function onClear(msg) {
      state.isReviewMode = false;
      if (msg.type === 'clear') state.hasSelection = false;
      if (msg.type !== 'scan-cancelled' && state.scanImages !== null) {
        state.images = state.tab === 'ppi' ? state.scanImages : state.scanCCImages;
        state.listTotal = state.scanTotal;
        state.listContext = 'Scan';
        renderList();
      } else {
        state.images = [];
        state.index = 0;
        state.selectionIds = [];
        renderEmpty();
      }
    }

    function onSelectionContext(msg) {
      state.hasSelection = msg.hasSelection;
      if (state.scanImages === null && !state.isReviewMode) {
        state.images = [];
        state.index = 0;
        renderEmpty();
      }
    }

    function onScanProgress(msg) {
      const pct = (msg.current / msg.total) * 100;
      const pb = document.getElementById('pb');
      const st = document.getElementById('scan-status');
      const ct = document.getElementById('scan-count');
      if (pb) pb.style.width = pct + '%';
      if (st) st.textContent = `Scanning images... ${Math.round(pct)}%`;
      if (ct) ct.textContent = `${msg.current} / ${msg.total}`;
    }

    function onScanResults(msg) {
      state.scanImages   = msg.images;
      state.scanCCImages = msg.ccImages || null;
      state.scanTotal    = msg.total;
      state.listTotal    = msg.total;
      state.tab          = 'ppi';
      state.images       = msg.images;
      state.listContext  = 'Scan';
      state.isReviewMode = false;
      renderList();
    }

    function onDownloadFile(msg) {
      const blob = new Blob([msg.bytes], { type: 'image/png' });
      const url  = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${msg.name}.png`;
      link.click();
      window.URL.revokeObjectURL(url);
    }

    // ── Message Dispatcher ──────────────────────────────────────────────────

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'debug-logs') {
        state.debugLogs = msg.logs;
        return;
      }

      switch (msg.type) {
        case 'images-list':      onImagesList(msg);      break;
        case 'clear':            onClear(msg);           break;
        case 'scan-cancelled':   onClear(msg);           break;
        case 'selection-context': onSelectionContext(msg); break;
        case 'scan-progress':    onScanProgress(msg);    break;
        case 'scan-results':     onScanResults(msg);     break;
        case 'download-file':    onDownloadFile(msg);    break;
      }
    };

    renderEmpty();
  </script>
</body>
</html>
